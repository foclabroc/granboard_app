name: granboard_proto
description: Appli de flechettes pour cible GranBoard
publish_to: 'none'
version: 0.6.14+24

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.34.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.0
  url_launcher: ^6.2.0
  open_filex: ^4.3.2
  wakelock_plus: ^1.8.0
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  image_picker: ^1.2.4
  image: ^4.12.0
  record: ^7.2.0
  flutter_webrtc: ^1.6.3
  video_player: ^2.14.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Copie locale : décodeur logiciel sur Android TV (voir packages/video_player_android)
dependency_overrides:
  video_player_android:
    path: packages/video_player_android

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/sounds/turn/
    - assets/music/
    - assets/images/
    - assets/avatars/
    - assets/awards/
    - assets/hits/
    - assets/voice/
    - assets/wallpapers/
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
