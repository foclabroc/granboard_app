name: APK

# Lancé à la main : onglet Actions → APK → Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Ta clé debug (secret DEBUG_KEYSTORE, en base64) pour que chaque APK
      # ait la même signature que tes builds locaux → mise à jour sans désinstaller
      - name: Clé debug
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::error::Secret DEBUG_KEYSTORE manquant"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - name: Version
        id: v
        run: echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: granboard-${{ steps.v.outputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk
